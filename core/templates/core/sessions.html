<script>
$(document).ready(function() {
    $('#sessions-table').DataTable({
        "processing": true,
        "serverSide": true,
        "ajax": "{% url 'ajax_sessions_data' %}", // Your AjaxDatatableView URL
        "initComplete": function () {
            // Clone the header row and insert it below the original one.
            // This creates a dedicated row for filters.
            $('#sessions-table thead tr')
                .clone(true) // Clone with event handlers (if any)
                .addClass('filters') // Add a class for easier styling
                .appendTo('#sessions-table thead');

            // Disable sorting on the cloned filter row, if needed (optional)
            // If you want sorting only on the original header row, and not the filter row.
            // This applies to the cloned row (filters) to prevent sorting when clicking on filter inputs.
            $('#sessions-table thead .filters th').each(function () {
                $(this).off('click.DT'); // Remove DataTables default click handler for sorting
            });


            this.api().columns().every(function () {
                let column = this;
                let colIdx = column.index(); // Get the index of the current column

                // Find the corresponding <th> in the newly created 'filters' row.
                // We target the 'filters' class to make sure we're adding to the correct row.
                let headerCell = $('.filters th').eq(colIdx);
                let title = $(column.header()).text(); // Get the original column title

                // Check if the current column is the first empty one (<th></th>)
                // If it is, you might not want a filter there, or you can add a generic one.
                if (title === "") { // Or check for specific column index like colIdx === 0
                    headerCell.html(''); // Keep it empty or add a placeholder
                    return; // Skip adding a filter for this column
                }

                // --- Choose one of the following filter types ---

                // Option 1: Text Input Filter (most common)
                let input = $('<input type="text" placeholder="Пошук по ' + title + '" />')
                    .appendTo(headerCell.empty()) // Clear the cell and append the input
                    .on('keyup change clear', function () {
                        if (column.search() !== this.value) {
                            column.search(this.value).draw();
                        }
                    });

                // Option 2: Select Dropdown Filter (uncomment and use instead of Option 1 if needed)
                /*
                let select = document.createElement('select');
                select.add(new Option('', '')); // Add an empty option to clear filter

                $(select).on('change', function () {
                    let val = $(this).val();
                    // Use regex for exact match for select options: ^value$
                    column.search(val ? '^' + val + '$' : '', true, false).draw();
                });

                // Populate select options. IMPORTANT for serverSide:

                // a separate AJAX call to your backend.

                    if (d !== null && d !== undefined) {

                */
            });
        }
    });
});

 {% load static %} <!-- Банер (карусель) -->
 <style>
#carouselExample {
    max-width: 900px; /* Максимальная ширина карусели для десктопов */
    margin: 20px auto;   /* Центрируем и добавляем отступы сверху/снизу */
    box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Добавляем небольшую тень для лучшего вида */
    border-radius: 8px; /* Немного скругляем углы */
    overflow: hidden; /* Убедимся, что тень и скругления не обрезаны */
}

/* Адаптивность ширины: уже хорошо работает с max-width и margin: auto */
@media (max-width: 991.98px) { /* Для планшетов и мобильных устройств (Bootstrap `lg` breakpoint) */
    #carouselExample {
        max-width: 100%; /* Карусель занимает всю доступную ширину */
        border-radius: 0; /* Убираем скругления на мобильных, если выглядит лучше */
    }
}


/* Стили для каждого слайда карусели */
.carousel-item {
    height: 300px; /* Базовая высота для мобильных */
    /* overflow: hidden; - не требуется, так как object-fit: cover */
}

/* Стили для изображения внутри слайда */
/* d-block w-100 уже дает width: 100% и display: block; */
/* object-fit: cover; нужен для того, чтобы изображения заполняли слайд без искажений */
.carousel-item img { /* Используем селектор по тегу img внутри .carousel-item для специфичности */
    height: 100%; /* Изображение занимает 100% высоты своего родителя (.carousel-item) */
    object-fit: cover; /* Обрезает изображение так, чтобы оно полностью покрывало область, сохраняя пропорции */
    /* width: 100%; и display: block; уже обрабатываются классами Bootstrap d-block w-100 */
}

/* Медиа-запросы для адаптивности высоты слайдов */
@media (min-width: 768px) { /* Для средних устройств (md breakpoint) */
    .carousel-item {
        height: 400px; /* Увеличиваем высоту на планшетах */
    }
}
@media (min-width: 992px) { /* Для больших устройств (lg breakpoint) */
    .carousel-item {
        height: 500px; /* Еще больше высота на больших десктопах */
    }
}
@media (min-width: 1200px) { /* Для очень больших устройств (xl breakpoint) */
    .carousel-item {
        height: 550px; /* Максимальная высота */
    }
}

/* Дополнительные стили для навигационных кнопок, если они не выглядят хорошо по умолчанию */
.carousel-control-prev,
.carousel-control-next {
    width: 10%; /* Уменьшаем ширину кнопок, чтобы они не занимали слишком много места по бокам */
}

</style>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    {% for picture in gallery_pictures_list %}
      <div class="carousel-item {% if forloop.first %}active{% endif %}">
        <img src="{{ picture.image.url }}" class="d-block w-100" alt="Зображення галереї">
      </div>
    {% endfor %}
  </div>

  {% if gallery_pictures_list|length > 1 %}
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Назад</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Вперед</span>
    </button>
  {% endif %}
</div>

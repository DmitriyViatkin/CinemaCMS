serverclient_max_body_size 250M; # <-- Добавьте эту строку
 {
    listen 80;
    server_name 167.172.105.200;
    client_max_body_size 250M; # <-- Добавьте эту строку


    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # БЛОК ДЛЯ ADMINLTE - ОБРАБАТЫВАЕТ ЗАПРОСЫ /static/admins/dist/
    location /static/admins/dist/ {
        alias /app/static_collected/admins/docs/assets/;
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ОБЩИЙ БЛОК ДЛЯ ОСТАЛЬНОЙ СТАТИКИ /static/
    location /static/ {
        alias /app/static_collected/;
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # БЛОК ДЛЯ МЕДИАФАЙЛОВ /media/
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # БЛОК ДЛЯ WEBSOCKET (если есть)
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
# nginx/nginx.conf



# Блок `server` визначає віртуальний хост Nginx.
server {
    # Nginx буде слухати HTTP-запити на порті 80.
    listen 80;


    server_name localhost;


    client_max_body_size 100M;


    location /static/ {
        # `alias` вказує на фізичну директорію в контейнері Nginx,
        # куди монтуються ваші зібрані статичні файли.
        # Пам'ятайте, ми монтували `./static` з хосту в `/app/static` в контейнері `nginx`.
        #alias /app/static/;
        alias /app/static_collected/;
        # Кешування статичних файлів на місяць для покращення продуктивності.
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Конфігурація для обслуговування медіафайлів (завантажених користувачами).
    # Усі запити, що починаються з `/media/`, будуть обслуговуватися Nginx напряму.
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }


    location / {
        # `proxy_pass` направляє запит до групи серверів `django`, яку ми визначили вище.
        proxy_pass http://web:8000;

        # Ці заголовки важливі для того, щоб Django правильно визначав IP-адресу клієнта,
        # протокол (HTTP/HTTPS) та ім'я хоста.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme; # Важливо для HTTPS-редиректів
        proxy_redirect off; # Забороняє Nginx автоматично переписувати заголовки Location


        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }


}

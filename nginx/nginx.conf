server {
    listen 80;
    server_name 167.172.105.200; # Или _, если вы предпочитаете wildcard.
                                 # Если вы не уверены, используйте 167.172.105.200

    # Прокси всех запросов к Django (для основного приложения и админ-панели)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- КЛЮЧЕВОЙ БЛОК ДЛЯ ADMINLTE ---
    # Этот блок перехватывает запросы, которые начинаются с /static/admins/dist/
    # и перенаправляет их на фактическое местоположение файлов AdminLTE в волюме.
    location /static/admins/dist/ {
        alias /app/static_collected/admins/docs/assets/; # <--- ЭТОТ ПУТЬ ДОЛЖЕН БЫТЬ ТОЧНЫМ!
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # --- ОБЩИЙ БЛОК ДЛЯ ДРУГИХ СТАТИЧЕСКИХ ФАЙЛОВ ---
    # Этот блок обслуживает все остальные запросы к /static/, которые не были перехвачены выше.
    location /static/ {
        alias /app/static_collected/;
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # --- БЛОК ДЛЯ МЕДИА-ФАЙЛОВ ---
    # Обслуживание медиа-файлов (загруженных пользователями)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # --- БЛОК ДЛЯ WEBSOCKET (если есть) ---
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
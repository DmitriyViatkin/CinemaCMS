{#movie_card.html#}
{% load static %}
{% load i18n %}
<div class="card h-100">
  {% if movie.main_picture %}
    <img src="{{ movie.main_picture.image.url }}" class="card-img-top" alt="{{ movie.title }}" style="height: 250px; object-fit: cover;">
  {% else %}
    <div class="d-flex align-items-center justify-content-center" style="height: 250px; background-color: #e9ecef;">
      <span class="text-muted">{% trans "Зображення відсутнє" %} </span>
    </div>
  {% endif %}
  <div class="card-body">

   <a href="{% url 'movie_detail' movie_id=movie.id %}" class="btn btn-primary">{{ movie.title }}</a>
  </div>
</div>

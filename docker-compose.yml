nginx:
  build:
    context: /root/CinemaCMS/nginx
    dockerfile: Dockerfile
  depends_on:
    web:
      condition: service_started
      required: true
  networks:
    app-network: null
  ports:
    - mode: ingress
      target: 80
      published: "80"
      protocol: tcp
    - mode: ingress
      target: 443
      published: "443"
      protocol: tcp
  volumes:
    - type: bind
      source: /root/CinemaCMS/nginx/nginx.conf
      target: /etc/nginx/conf.d/default.conf
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /root/CinemaCMS/static_collected
      target: /app/static_collected
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /root/CinemaCMS/media
      target: /app/media
      read_only: true
      bind:
        create_host_path: true
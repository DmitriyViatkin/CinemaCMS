{% extends 'admin/index.html' %}
{% load static %}

{% block title %}Список місць{% endblock %}

{% block content %}
<section class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h3 class="card-title mb-0">Список місць сеансу</h3>
            <div>
              <a href="{% url 'add_seats'%}" class="btn btn-success btn-sm">
                <i class="fas fa-plus"></i> Додати місце
              </a>
            </div>
          </div>
          <div id="seats-table-container">
                  {% include 'admin/seats_list/seats_table_partial.html' %}
          </div>
        </div>
      </div>
    </div>
  </div>
</section>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript">
    $(document).ready(function() {
        $('#pagination a.page-link').on('click', function(e) {
            e.preventDefault();
            var page_url = $(this).attr('href');
            loadSeats(page_url);
        });
    });

    function loadSeats(url) {
        $.ajax({
            url: url,
            type: 'GET',
            success: function(data) {
                $('#seats-table-container').html(data);

                $('#pagination a.page-link').on('click', function(e) {
                    e.preventDefault();
                    var new_page_url = $(this).attr('href');
                    loadSeats(new_page_url);
                });
            },
            error: function(xhr, status, error) {
                console.error("Помилка завантаження місць:", error);
            }
        });
    }
</script>

{% endblock %}

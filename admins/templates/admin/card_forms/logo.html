<div class="main-picture-form border p-3 mb-3">
    {% for field in logo_form %}
        {% if field.name == 'image' %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="alert alert-danger">{{ field.errors }}</div>
                {% endif %}
                <div class="image-preview" style="max-width: 200px; max-height: 200px; margin-top: 10px;">
                    {% if logo_form.instance.image %}
                        <img src="{{ logo_form.instance.image.url }}" style="max-width: 100%; max-height: 100%;">
                    {% endif %}
                </div>
            </div>
        {% endif %}
    {% endfor %}
    {% for hidden in logo_form.hidden_fields %}
        {{ hidden }}
    {% endfor %}
</div>

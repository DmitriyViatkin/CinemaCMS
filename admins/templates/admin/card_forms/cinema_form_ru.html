{# admin/card_forms/cinema_form.html #}
{% load static %}
{% load i18n %}

<div class="card-body form-block">
  <div class="form-group field-row-aligned">
    <label class="label-wrapper" for="{{ title.id_for_label }}">Название </label>
    <div class="input-wrapper">{{ form.title_ru }}</div>
  </div>

  <div class="form-group field-row-aligned">
    <label class="label-wrapper"  for="{{   form.description_ru.id_for_label }}" > Описание </label>
    <div class="input-wrapper">{{ form.description_ru }}</div>
  </div>

  <div class="form-group field-row-aligned">
    <label class="label-wrapper"  for="{{   form.conditions_ru.id_for_label }}"> Условия</label>
    <div class="input-wrapper">{{ form.conditions_ru }}</div>
  </div>

  <div class="form-group field-row-aligned">
    <label class="label-wrapper"  for="{{    form.city_ru.id_for_labellabel }}"> Город </label>
    <div class="input-wrapper">{{ form.city_ru }}</div>
  </div>
</div>

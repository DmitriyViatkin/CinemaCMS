<h2>Список Залів</h2>

<table class="table">
    <thead>
        <tr>
            <th>Назва</th>
            <th>Дата створення</th>
            <th>Дії</th>
        </tr>
    </thead>
    <tbody>
        {% for hall in halls %}
            <tr>
                <td>{{ hall.title }}</td>
                <td>{{ hall.date }}</td>
                <td>
                    <a href="{% url 'add_halls_edit' hall.id %}" class="btn btn-sm btn-primary"><i class="fas fa-pencil-alt"></i></a>
                    <button type="button" class="btn btn-sm btn-danger" data-toggle="modal" data-target="#deleteHallModal{{ hall.id }}"><i class="fas fa-trash"></i></button>

                    <div class="modal fade" id="deleteHallModal{{ hall.id }}" tabindex="-1" role="dialog" aria-labelledby="deleteHallModalLabel{{ hall.id }}" aria-hidden="true">
                        <div class="modal-dialog" role="document">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="deleteHallModalLabel{{ hall.id }}">Підтвердження видалення</h5>
                                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                </div>
                                <div class="modal-body">
                                    Ви впевнені, що хочете видалити зал "{{ hall.title }}"?
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Скасувати</button>
                                    <a href="{% url 'delete_halls' hall.id %}" class="btn btn-danger">Видалити</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="3">Для цього кінотеатру ще не додано жодного залу.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>

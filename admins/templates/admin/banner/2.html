<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ formset.management_form }}
    <h2>Управление элементами галереи: {{ gallery }}</h2>
    {% for form in formset %}
        <div class="combined-form">
            {{ form.as_p }}
        </div>
        <hr>
    {% endfor %}
    <button type="submit">Сохранить</button>
</form>

<div class="card bg-gradient-info">
  <div class="card-header border-0">
    <h3 class="card-title">
      <i class="fas fa-th mr-1"></i>
      Графік продажів квитків {# <<< Змінено заголовок картки #}
    </h3>

    <div class="card-tools">
      <button type="button" class="btn bg-info btn-sm" data-card-widget="collapse">
        <i class="fas fa-minus"></i>
      </button>
      <button type="button" class="btn bg-info btn-sm" data-card-widget="remove">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
  <div class="card-body">
    {# Елемент canvas для графіка - залишаємо як є #}
    <canvas class="chart" id="line-chart" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
  </div>
  <div class="card-footer bg-transparent">
    <div class="row">

      <div class="col-4 text-center">
        {# <<< Замінено статичне value="20" на змінну knob_data.category1 #}
        <input type="text" class="knob" data-readonly="true" value="{{ knob_data.category1|default:0 }}" data-width="60" data-height="60"
               data-fgColor="#39CCCC">

        <div class="text-white">Категорія 1</div>
      </div>
      <div class="col-4 text-center">

        <input type="text" class="knob" data-readonly="true" value="{{ knob_data.category2|default:0 }}" data-width="60" data-height="60"
               data-fgColor="#39CCCC">

        <div class="text-white">Категорія 2</div>
      </div>
      <div class="col-4 text-center">

        <input type="text" class="knob" data-readonly="true" value="{{ knob_data.category3|default:0 }}" data-width="60" data-height="60"
               data-fgColor="#39CCCC">

        <div class="text-white">Категорія 3</div>
      </div>
      </div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const chartDays = {{ chart_days|safe }};
    const cinemaSales = {{ cinema_sales|safe }};

    const colors = [
      '#007bff', '#28a745', '#ffc107', '#dc3545', '#6f42c1',
      '#20c997', '#fd7e14', '#6610f2', '#e83e8c', '#17a2b8'
    ];

    const datasets = Object.entries(cinemaSales).map(([cinemaName, sales], index) => ({
      label: cinemaName,
      data: sales,
      borderColor: colors[index % colors.length],
      fill: false,
      tension: 0.3
    }));

    const ctx = document.getElementById('line-chart');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: chartDays,
        datasets: datasets
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              precision: 0
            }
          }
        },
        plugins: {
          legend: {
            position: 'top'
          },
          title: {
            display: true,
            text: 'Продажі квитків по кінотеатрах за останні 30 днів'
          }
        }
      }
    });
  });
</script>

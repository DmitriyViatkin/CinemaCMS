{# card_action.html #}
<div class="row row-cols-1 row-cols-md-2 g-4">
  {% for item in promotions %}
    <div class="col">
      <div class="card h-100">
        {% if item.main_picture %}
          <img src="{{ item.main_picture.image.url }}" class="card-img-top" alt="{{ item.title }}" style="height: 250px; object-fit: cover;">
        {% else %}
          <div class="d-flex align-items-center justify-content-center" style="height: 250px; background-color: #e9ecef;">
            <span class="text-muted">Зображення відсутнє</span>
          </div>
        {% endif %}
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ item.title }}</h5>
          <p class="card-text">{{ item.description|truncatewords:25 }}</p>
          <div class="mt-auto d-flex justify-content-between">
            <a href="{% url 'main:promotion_detail' item.seo_block.seo_url %}" class="btn btn-outline-primary">Детальніше</a>
            {% if item.url_video %}
              <a href="{{ item.url_video }}" class="btn btn-outline-secondary" target="_blank">Відео</a>
            {% endif %}
          </div>
        </div>

        <div class="card-footer text-muted">
          {{ item.date_publication|date:"d.m.Y" }}
        </div>
      </div>
    </div>
  {% endfor %}
</div>

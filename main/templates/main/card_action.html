{# card_action.html #}
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-4 g-4 justify-content-center">
  {% for item in promotions %}
    <div class="col">

      <div class="card h-100 bg-dark text-white rounded shadow-sm">
        {% if item.main_picture %}
          <img src="{{ item.main_picture.image.url }}" class="card-img-top" alt="{{ item.title }}" style="height: 250px; object-fit: cover;">
        {% else %}
          <div class="d-flex align-items-center justify-content-center" style="height: 250px; background-color: #e9ecef;">
            <span class="text-muted">Изображение отсутствует</span>
          </div>
        {% endif %}
        <div class="card-body d-flex flex-column">
          <h5 class="card-title"><a href="{% url 'main:promotion_detail' item.seo_block.seo_url %}" class="btn btn-outline-primary">{{ item.title }} </a> </h5>
          <p class="card-text">{{ item.description|truncatewords:25 }}</p>

        </div>

        {# Make sure the footer also looks good on dark #}
        <div class="card-footer text-muted border-top border-secondary">
          {{ item.date_publication|date:"d.m.Y" }}
        </div>
      </div>
    </div>
  {% endfor %}
</div>
